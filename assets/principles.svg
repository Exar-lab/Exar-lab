"8.8" fill="#8aa4bf" class="sans" font-weight="400" text-anchor="middle" >Red, green, refactor. Always.</text><rect x="370" y="96" width="160" height="120" rx="12" fill="url(#card)" stroke="#1b4466"/><rect x="380" y="96" width="140" height="3" rx="1.5" fill="url(#acc)"/><text x="384" y="124" font-size="18" fill="#22d3ee" class="mono" font-weight="700" text-anchor="start" >03</text><circle cx="512" cy="118" r="4" fill="#22d3ee" class="pulse"/><text x="450.0" y="158" font-size="11.5" fill="#e6f4ff" class="sans" font-weight="800" text-anchor="middle" letter-spacing="1" >CLEAN DESIGN</text><rect x="384" y="170" width="132" height="1" fill="#1b4466"/><text x="450.0" y="194" font-size="8.8" fill="#8aa4bf" class="sans" font-weight="400" text-anchor="middle" >Hexagonal boundaries, SOLID code.</text><rect x="540" y="96" width="160" height="120" rx="12" fill="url(#card)" stroke="#1b4466"/><rect x="550" y="96" width="140" height="3" rx="1.5" fill="url(#acc)"/><text x="554" y="124" font-size="18" fill="#22d3ee" class="mono" font-weight="700" text-anchor="start" >04</text><circle cx="682" cy="118" r="4" fill="#22d3ee" class="pulse"/><text x="620.0" y="158" font-size="11.5" fill="#e6f4ff" class="sans" font-weight="800" text-anchor="middle" letter-spacing="1" >SECURE BY DEFAULT</text><rect x="554" y="170" width="132" height="1" fill="#1b4466"/><text x="620.0" y="194" font-size="8.8" fill="#8aa4bf" class="sans" font-weight="400" text-anchor="middle" >Auth and roles in every layer.</text><rect x="710" y="96" width="160" height="120" rx="12" fill="url(#card)" stroke="#1b4466"/><rect x="720" y="96" width="140" height="3" rx="1.5" fill="url(#acc)"/><text x="724" y="124" font-size="18" fill="#22d3ee" class="mono" font-weight="700" text-anchor="start" >05</text><circle cx="852" cy="118" r="4" fill="#22d3ee" class="pulse"/><text x="790.0" y="158" font-size="11.5" fill="#e6f4ff" class="sans" font-weight="800" text-anchor="middle" letter-spacing="1" >HUMAN IN LOOP</text><rect x="724" y="170" width="132" height="1" fill="#1b4466"/><text x="790.0" y="194" font-size="8.8" fill="#8aa4bf" class="sans" font-weight="400" text-anchor="middle" >AI accelerates. I decide.</text></svg>